<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi - Sakit, Izin, Alfa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background-color: #f0f2f5; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }
        
        /* Form Styling */
        .form-group { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        select, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        .btn-simpan { background-color: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-simpan:hover { background-color: #1557b0; }
        
        /* Export Button */
        .btn-export { background-color: #1d6f42; color: white; border: none; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-export:hover { background-color: #145532; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f1f3f4; color: #333; }
        .status-hadir { color: green; font-weight: bold; }
        .status-sakit { color: orange; font-weight: bold; }
        .status-izin { color: blue; font-weight: bold; }
        .status-alfa { color: red; font-weight: bold; }

        /* Tab System */
        .tabs { display: flex; gap: 5px; margin-top: 20px; }
        .tab-btn { background: #dadce0; color: #3c4043; border: none; cursor: pointer; padding: 10px 20px; border-radius: 8px 8px 0 0; }
        .tab-btn.active { background: #1a73e8; color: white; }
        .tab-content { display: none; padding: 20px; border: 1px solid #ddd; background: white; border-radius: 0 8px 8px 8px; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>INPUT DAFTAR HADIR SISWA KELAS 5 MI BATULAWANG KOTA BANJAR</h2>
    
    <div class="form-group">
        <select id="namaSiswa">
            <option value="">-- Pilih Nama --</option>
            <option value="Budi Santoso">ANDIKA</option>
			<option value="Budi Santoso">AULIA NUR LATIPAH</option>
			<option value="Budi Santoso">ALIF FATHURROHMAN KUSMAYADI</option>
			<option value="Budi Santoso">CAKRA GUMILANG</option>
			<option value="Budi Santoso">CANTIKA NAURA MAULIDA</option>
			<option value="Budi Santoso">DEDE YUSRIL ZAELANI</option>
			<option value="Budi Santoso">ERIL IRWANSYAH</option>
			<option value="Budi Santoso">GANDI LATIFATUL KHOFI</option>
			<option value="Budi Santoso">HAFIZA SALSABILA</option>
			<option value="Budi Santoso">HEXA ADITYA PUTRA</option>
            <option value="Siti Aminah">INDADARI PUTRI DAMARA</option>
            <option value="Andi Wijaya">IRHAM FAUZI</option>
			<option value="Budi Santoso">LAURA PUTRI ANJANI</option>
			<option value="Budi Santoso">NAILA MUAZAHRA ARIFIN</option>
			<option value="Budi Santoso">RAINA CEUCEU PEBRIANI</option>
			<option value="Budi Santoso">RANIA KHUMAIRAH</option>
			<option value="Budi Santoso">RAYA AGUSTIN</option>
			<option value="Budi Santoso">SAQILLA AZAHRA</option>
			<option value="Budi Santoso">SYIFA NURFADILAH</option>
			<option value="Budi Santoso">WIDA WATI</option>
			<option value="Budi Santoso">ZALFA NAQIYA AKHYAR</option>
			<option value="Budi Santoso">ZAMZAM KHOERUL ARIFIN</option>
			<option value="Budi Santoso">ZERNIH NUR INDAH</option>
        </select>

        <select id="statusAbsen">
            <option value="Hadir">Hadir</option>
            <option value="Sakit">Sakit</option>
            <option value="Izin">Izin</option>
            <option value="Alfa">Alfa</option>
        </select>

        <button class="btn-simpan" onclick="tambahAbsen()">Catat Kehadiran</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'mingguan')">Mingguan (Log)</button>
        <button class="tab-btn" onclick="openTab(event, 'bulanan')">Bulanan (Rekap)</button>
        <button class="tab-btn" onclick="openTab(event, 'semesteran')">Semesteran (Rekap)</button>
    </div>

    <!-- Tab Mingguan (Log Detail) -->
    <div id="mingguan" class="tab-content active">
        <button class="btn-export" onclick="exportExcel('tableMingguan', 'Log_Mingguan')">📂 Export Excel</button>
        <table id="tableMingguan">
            <thead>
                <tr>
                    <th>Waktu/Tanggal</th>
                    <th>Nama</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="bodyMingguan"></tbody>
        </table>
    </div>

    <!-- Tab Bulanan -->
    <div id="bulanan" class="tab-content">
        <button class="btn-export" onclick="exportExcel('tableBulanan', 'Rekap_Bulanan')">📂 Export Excel</button>
        <table id="tableBulanan">
            <thead>
                <tr>
                    <th>Nama Siswa</th>
                    <th>Hadir</th>
                    <th>Sakit</th>
                    <th>Izin</th>
                    <th>Alfa</th>
                </tr>
            </thead>
            <tbody id="bodyBulanan"></tbody>
        </table>
    </div>

    <!-- Tab Semesteran -->
    <div id="semesteran" class="tab-content">
        <button class="btn-export" onclick="exportExcel('tableSemesteran', 'Rekap_Semesteran')">📂 Export Excel</button>
        <table id="tableSemesteran">
            <thead>
                <tr>
                    <th>Nama Siswa</th>
                    <th>Hadir</th>
                    <th>Sakit</th>
                    <th>Izin</th>
                    <th>Alfa</th>
                </tr>
            </thead>
            <tbody id="bodySemesteran"></tbody>
        </table>
    </div>
</div>

<script>
    let dbAbsensi = [];

    function tambahAbsen() {
        const nama = document.getElementById('namaSiswa').value;
        const status = document.getElementById('statusAbsen').value;
        
        if (!nama) {
            alert("Silakan pilih nama terlebih dahulu!");
            return;
        }

        const sekarang = new Date();
        const tglString = sekarang.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const waktuString = sekarang.toLocaleTimeString('id-ID');

        const dataBaru = {
            nama: nama,
            status: status,
            tanggal: tglString,
            waktu: waktuString
        };

        dbAbsensi.push(dataBaru);
        renderData();
        alert(`Berhasil mencatat: ${nama} (${status})`);
    }

    function renderData() {
        const bodyMingguan = document.getElementById('bodyMingguan');
        const bodyBulanan = document.getElementById('bodyBulanan');
        const bodySemesteran = document.getElementById('bodySemesteran');

        bodyMingguan.innerHTML = "";
        bodyBulanan.innerHTML = "";
        bodySemesteran.innerHTML = "";

        // Objek untuk menampung hitungan (rekap)
        let rekap = {};

        dbAbsensi.forEach(item => {
            // Render Log Mingguan
            let kls = "status-" + item.status.toLowerCase();
            bodyMingguan.innerHTML += `
                <tr>
                    <td>${item.tanggal} <br> <small>${item.waktu}</small></td>
                    <td>${item.nama}</td>
                    <td class="${kls}">${item.status}</td>
                </tr>`;
            
            // Inisialisasi rekap jika nama belum ada
            if (!rekap[item.nama]) {
                rekap[item.nama] = { Hadir: 0, Sakit: 0, Izin: 0, Alfa: 0 };
            }
            // Tambah hitungan sesuai status
            rekap[item.nama][item.status]++;
        });

        // Render Tab Bulanan & Semesteran (format sama)
        for (let nama in rekap) {
            let row = `
                <tr>
                    <td style="text-align:left">${nama}</td>
                    <td>${rekap[nama].Hadir}</td>
                    <td>${rekap[nama].Sakit}</td>
                    <td>${rekap[nama].Izin}</td>
                    <td>${rekap[nama].Alfa}</td>
                </tr>`;
            bodyBulanan.innerHTML += row;
            bodySemesteran.innerHTML += row;
        }
    }

    function openTab(evt, tabName) {
        let contents = document.getElementsByClassName("tab-content");
        let buttons = document.getElementsByClassName("tab-btn");
        for (let i = 0; i < contents.length; i++) {
            contents[i].classList.remove("active");
            buttons[i].classList.remove("active");
        }
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    function exportExcel(tableID, filename) {
        const table = document.getElementById(tableID);
        const wb = XLSX.utils.table_to_book(table, { sheet: "Data" });
        XLSX.writeFile(wb, `${filename}.xlsx`);
    }
</script>

</body>
</html>
